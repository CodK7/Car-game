<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wahiba Sands Off-Road</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 12 Q5 5 9 9 T16 8 V16 H0Z' fill='%23e2a15c'/%3E%3C/svg%3E" />
    <style>
      :root { --sand: #e2a15c; --ink: #1d1611; --panel: rgba(24, 17, 11, 0.72); --line: rgba(255, 220, 170, 0.22); --text: #f6e7d2; --dim: #c9b193; --warn: #ffb347; --bad: #ff6b57; --ok: #9fd68a; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120d09; color: var(--text); font-family: "Segoe UI", Tahoma, system-ui, sans-serif; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 70%, #5a3518 0%, #1a110a 70%); z-index: 50; transition: opacity 0.6s; }
      #loading h1 { margin: 0; font-size: clamp(26px, 5vw, 54px); letter-spacing: 0.04em; font-weight: 700; color: var(--sand); }
      #loading .ar { font-size: clamp(18px, 3vw, 30px); color: var(--text); direction: rtl; }
      #loading .msg { color: var(--dim); font-size: 14px; min-height: 1.4em; font-variant-numeric: tabular-nums; }
      #loading.err .msg { color: var(--bad); white-space: pre-wrap; max-width: 80vw; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-size: 13px; }
      #ui > * { pointer-events: auto; }
      #stats { position: absolute; left: 8px; top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 12px/1.45 Consolas, monospace; white-space: pre; pointer-events: none; display: none; }
      #credits { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: rgba(255, 255, 255, 0.45); pointer-events: none; text-align: right; }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="ui">
      <div id="stats"></div>
      <div id="credits"></div>
    </div>
    <div id="loading">
      <h1>WAHIBA SANDS OFF-ROAD</h1>
      <div class="ar">تطعيس رمال الشرقية</div>
      <div class="msg">loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
