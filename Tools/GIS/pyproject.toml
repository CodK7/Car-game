[project]
name = "wahiba-gis"
version = "0.1.0"
description = "DEM + OSM pipeline producing UE Landscape heightmaps for the Wahiba Sands play area"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3.9",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
